name: 打包/编译 应用

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_version:
        description: '打包/编译版本'
        required: false
        default: ''
      confirm_build:
        description: '确认打包/编译应用（输入 "yes" 确认）'
        required: false
        default: 'yes'

jobs:
  build-go:
    name: 编译 Go 应用 (${{ matrix.arch }}) 在 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
        include:
          - os: windows-latest
            ext: .dll
            goos: windows
          - os: ubuntu-latest
            ext: .so
            goos: linux
          - os: macos-latest
            ext: .dylib
            goos: darwin

    steps:
    - name: 检查用户确认打包/编译应用
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_build != 'yes'
      run: |
        echo "用户未确认打包/编译应用。跳过打包/编译。"
        exit 0

    - name: 检出代码仓库
      uses: actions/checkout@v4
      with:
        working-directory: TTHighSpeedDownloader

    - name: 设置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'

    - name: 安装 Go 库
      shell: bash
      working-directory: TTHighSpeedDownloader
      run: |
        go get github.com/gorilla/websocket@v1.5.3
        go mod tidy
        go mod download

    - name: 设置环境变量
      shell: bash
      run: |
        echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
        echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

    - name: 安装Windows ARM64交叉编译工具链
      if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
      run: |
        # Use msys2 to install the correct mingw-w64 toolchain for aarch64
        msys2-shell -mingw64 -here -c "pacman -Syu --noconfirm"
        msys2-shell -mingw64 -here -c "pacman -S --noconfirm --needed mingw-w64-x86_64-toolchain mingw-w64-aarch64-toolchain"
        echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
        echo "C:\msys64\mingwaarch64\bin" >> $GITHUB_PATH
      
    - name: 编译 Go 应用程序
      shell: bash
      working-directory: TTHighSpeedDownloader
      run: |
        set -x

        EXT=""
        case "${{ matrix.os }}" in
          windows-latest)
            EXT=".dll"
            ;;
          ubuntu-latest)
            EXT=".so"
            ;;
          macos-latest)
            EXT=".dylib"
            ;;
        esac

        echo "Building for OS: ${{ matrix.goos }}, Arch: ${{ matrix.arch }}"

        # Set compiler based on target
        if [[ "${{ matrix.os }}" == "windows-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
          export CC=aarch64-w64-mingw32-gcc
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          export CC=aarch64-linux-gnu-gcc
        fi

        # Build the application
        CGO_ENABLED=1 go build -v -buildmode=c-shared -o TTHighSpeedDownloader_${{ matrix.arch }}$EXT .

        # Check build result
        if [ $? -ne 0 ]; then
          echo "Build failed for ${{ matrix.goos }}/${{ matrix.arch }}"
          exit 1
        fi

    - name: 检查构建产物
      shell: bash
      working-directory: TTHighSpeedDownloader
      run: |
        ls -la TTHighSpeedDownloader_* || echo "No build artifacts found"

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: go-binary-${{ matrix.os }}-${{ matrix.arch }}
        path: TTHighSpeedDownloader/TTHighSpeedDownloader_${{ matrix.arch }}.*
        if-no-files-found: error

  build-gui:
    name: 编译 GUI 应用 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}  # 此处依赖 matrix.os，需在 strategy.matrix 中定义
    needs: build-go
    strategy:
      matrix:
        platform: [Windows]
        arch: [amd64]
        include:
          - platform: Windows
            os: windows-latest
          # - platform: Linux
          #   os: ubuntu-latest
          # - platform: MacOS
          #   os: macos-latest
        exclude:
          - platform: Windows
            arch: amd64
            # os: windows-latest
        # exclude:
        #   - platform: Windows
        #     arch: arm64
        #   - platform: Linux
        #     os: ubuntu-latest
        #     arch: arm64
        #   - platform: Linux
        #     os: ubuntu-latest
        #     arch: amd64
        #   - platform: MacOS
        #     os: macos-latest
        #     arch: arm64
        #   - platform: MacOS
        #     os: macos-latest
        #     arch: amd64

    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v4
    
    - name: 修复目录权限
      if: matrix.platform == 'MacOS'
      run: |
        cd GUI
        mkdir -p dist
        chmod 755 dist

    - name: 设置编码环境变量
      run: |
        echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.7'
        
    - name: 安装 Nuitka
      run: |
        pip install nuitka
        
    - name: 下载所有Go二进制文件
      uses: actions/download-artifact@v4
      with:
        path: ./downloaded-binaries
    
    - name: 验证下载的文件
      shell: bash
      run: |
        if [ ! -d "downloaded-binaries" ]; then
          echo "Error: downloaded-binaries directory not found"
          exit 1
        fi
        
        echo "Downloaded files:"
        ls -la downloaded-binaries/
        
        if [ $(find downloaded-binaries -mindepth 1 -maxdepth 1 -type d | wc -l) -eq 0 ]; then
          echo "Error: No artifacts downloaded"
          exit 1
        fi
    
    - name: 创建 binaries 目录并复制文件
      shell: bash
      run: |
        mkdir -p binaries
        
        # 根据平台复制相应的二进制文件
        case "${{ matrix.platform }}" in
          Windows)
            find downloaded-binaries -path "*windows*" \( -name "*.dll" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
          Linux)
            find downloaded-binaries -path "*ubuntu*" \( -name "*.so" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
          MacOS)
            find downloaded-binaries -path "*macos*" \( -name "*.dylib" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
        esac
        
        # 验证是否复制成功
        if [ ! -d "binaries" ] || [ $(ls -A binaries | wc -l) -eq 0 ]; then
          echo "Error: No files copied to binaries directory"
          exit 1
        fi
        
        echo "Files in binaries directory:"
        ls -la binaries/
    
    - name: 复制二进制文件到GUI目录
      shell: bash
      run: |
        mkdir -p GUI/binaries
        cp -r binaries/* GUI/binaries/
        echo "Files copied to GUI/binaries directory"
        
        # 验证复制结果
        if [ ! -d "GUI/binaries" ] || [ $(ls -A GUI/binaries | wc -l) -eq 0 ]; then
          echo "Error: Failed to copy files to GUI/binaries directory"
          exit 1
        fi
    
    - name: 编译 GUI 应用
      run: |
        cd GUI
        # 让
        python build.py --platform ${{ matrix.platform }}
        
    - name: 上传GUI产物
      uses: actions/upload-artifact@v4
      with:
        name: gui-${{ matrix.platform }}
        path: |
          GUI/dist/**
          GUI/dist/*
        if-no-files-found: error

  package-final:
    name: 打包最终发布版本
    needs: [build-go, build-gui]
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v4
      
    - name: 下载所有产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: 创建发布包结构
      run: |
        mkdir -p release/packages
        # 组织各平台的完整包
        for platform in windows linux macos; do
          mkdir -p "release/TTHighSpeedDownloader-$platform"
        done
        
    - name: 解析版本号和构建号
      id: parse_version
      shell: python
      run: |
        import re, os
        from datetime import datetime
        from pathlib import Path
        
        # 默认版本
        version = ""
        
        # 如果提供了输入版本，则使用它
        input_version = "${{ github.event.inputs.build_version }}"
        if input_version and input_version.strip():
            version = input_version.strip()
        
        with open("./VersionHistory.txt", "r", encoding="utf-8") as f:
            text = f.read()
          
        for line in text.split('\n'):
            if line.endswith(' V:'):
                version = line.split(' V:')[0]
        
        # 生成构建号 (YYYYMMDD.HHMMSS)
        build_number = datetime.now().strftime("%Y%m%d.%H%M%S")
        
        print('"version={version}" >> $GITHUB_OUTPUT')
        print('"build_number={build_number}" >> $GITHUB_OUTPUT')

        os.system(f'"version={version}" >> $GITHUB_OUTPUT')
        os.system(f'"build_number={build_number}" >> $GITHUB_OUTPUT')

        print(f"Version: {version}, Build: {build_number}")
        
    - name: 打包各平台完整发行版
      run: |
        VERSION=${{ steps.parse_version.outputs.version }}
        BUILD_NUMBER=${{ steps.parse_version.outputs.build_number }}
        FULL_VERSION="${VERSION}+${BUILD_NUMBER}"
        
        # Windows 版本
        mkdir -p "release/TTHighSpeedDownloader-windows-$FULL_VERSION"
        cp -r artifacts/gui-Windows/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-windows-latest-amd64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-windows-latest-arm64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cd release && zip -r "packages/TTHighSpeedDownloader-windows-$FULL_VERSION.zip" "TTHighSpeedDownloader-windows-$FULL_VERSION"
        
        # Linux 版本
        mkdir -p "release/TTHighSpeedDownloader-linux-$FULL_VERSION"
        cp -r artifacts/gui-Linux/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-ubuntu-latest-amd64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-ubuntu-latest-arm64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        tar -czf "release/packages/TTHighSpeedDownloader-linux-$FULL_VERSION.tar.gz" -C release "TTHighSpeedDownloader-linux-$FULL_VERSION"
        
        # macOS 版本
        mkdir -p "release/TTHighSpeedDownloader-macos-$FULL_VERSION"
        cp -r artifacts/gui-MacOS/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-macos-latest-amd64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-macos-latest-arm64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        tar -czf "release/packages/TTHighSpeedDownloader-macos-$FULL_VERSION.tar.gz" -C release "TTHighSpeedDownloader-macos-$FULL_VERSION"
        
    - name: 上传最终发布包
      uses: actions/upload-artifact@v4
      with:
        name: final-release-packages
        path: release/packages/*
        if-no-files-found: error
