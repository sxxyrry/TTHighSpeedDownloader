name: 打包/编译 应用

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_version:
        description: '打包/编译版本'
        required: false
        default: ''
      confirm_build:
        description: '确认打包/编译应用（输入 "yes" 确认）'
        required: false
        default: 'yes'

jobs:
  build-go:
    name: 编译 Go 应用 (${{ matrix.arch }}) 在 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        arch: [amd64, arm64]
        include:
          - os: windows-latest
            ext: .dll
            goos: windows
          - os: ubuntu-latest
            ext: .so
            goos: linux
          - os: macos-latest
            ext: .dylib
            goos: darwin

    steps:
    - name: 检查用户确认打包/编译应用
      if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm_build != 'yes'
      run: |
        echo "用户未确认打包/编译应用。跳过打包/编译。"
        exit 0

    - name: 检出代码仓库
      uses: actions/checkout@v4

    - name: 设置 Go 环境
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.0'

    - name: 安装 Go 库
      shell: bash
      run: |
        go get github.com/gorilla/websocket@v1.5.3
        go mod tidy
        go mod download

    - name: 设置环境变量
      shell: bash
      run: |
        echo "GOOS=${{ matrix.goos }}" >> $GITHUB_ENV
        echo "GOARCH=${{ matrix.arch }}" >> $GITHUB_ENV

    - name: Install Zig for ARM64 cross-compilation
      if: matrix.os == 'windows-latest' && matrix.arch == 'arm64'
      shell: powershell
      run: |
        choco install zig -y
        "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      
    - name: 编译 Go 应用程序
      shell: bash
      run: |
        set -x

        EXT=""
        case "${{ matrix.os }}" in
          windows-latest)
            EXT=".dll"
            ;;
          ubuntu-latest)
            EXT=".so"
            ;;
          macos-latest)
            EXT=".dylib"
            ;;
        esac

        echo "Building for OS: ${{ matrix.goos }}, Arch: ${{ matrix.arch }}"

        # Set compiler based on target
        if [[ "${{ matrix.os }}" == "windows-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
          export CC="zig cc -target aarch64-windows-gnu"
        elif [[ "${{ matrix.os }}" == "ubuntu-latest" && "${{ matrix.arch }}" == "arm64" ]]; then
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          export CC=aarch64-linux-gnu-gcc
        fi

        # Build the application
        CGO_ENABLED=1 go build -v -buildmode=c-shared -o TTHighSpeedDownloader_${{ matrix.arch }}$EXT .

        # Check build result
        if [ $? -ne 0 ]; then
          echo "Build failed for ${{ matrix.goos }}/${{ matrix.arch }}"
          exit 1
        fi

    - name: 检查构建产物
      shell: bash
      run: |
        ls -la TTHighSpeedDownloader_* || echo "No build artifacts found"

    - name: 上传编译产物
      uses: actions/upload-artifact@v4
      with:
        name: go-binary-${{ matrix.os }}-${{ matrix.arch }}
        path: TTHighSpeedDownloader_${{ matrix.arch }}.*
        if-no-files-found: error

  build-gui:
    name: 编译 GUI 应用 (${{ matrix.arch }}) 在 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-go
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        arch: [amd64, arm64]
        include:
          - os: windows-latest
            goos: windows
          # - os: ubuntu-latest
          #   goos: linux
          - os: macos-latest
            goos: darwin

    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v4
    
    - name: 修复目录权限
      if: matrix.goos == 'darwin'
      run: |
        cd GUI
        mkdir -p dist
        chmod 755 dist

    - name: 设置编码环境变量
      run: |
        echo "PYTHONIOENCODING=utf-8" >> $GITHUB_ENV

    - name: 设置 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.13.12'
        
    - name: 安装 uv
      run: |
        pip install uv

    - name: 安装 GTK+ 开发依赖 (Linux)
      if: matrix.goos == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libgl1-mesa-dev libnotify-dev

    - name: 同步环境
      run: |
        cd GUI
        uv sync

    - name: 下载所有Go二进制文件
      uses: actions/download-artifact@v4
      with:
        path: ./downloaded-binaries
    
    - name: 验证下载的文件
      shell: bash
      run: |
        if [ ! -d "downloaded-binaries" ]; then
          echo "Error: downloaded-binaries directory not found"
          exit 1
        fi
        
        echo "Downloaded files:"
        ls -la downloaded-binaries/
        
        if [ $(find downloaded-binaries -mindepth 1 -maxdepth 1 -type d | wc -l) -eq 0 ]; then
          echo "Error: No artifacts downloaded"
          exit 1
        fi
    
    - name: 创建 binaries 目录并复制文件
      shell: bash
      run: |
        mkdir -p binaries
        
        # 根据平台复制相应的二进制文件
        case "${{ matrix.goos }}" in
          windows)
            find downloaded-binaries -path "*windows*" \( -name "*.dll" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
          linux)
            find downloaded-binaries -path "*linux*" \( -name "*.so" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
          darwin)
            find downloaded-binaries -path "*macos*" \( -name "*.dylib" \) | while read file; do
              cp "$file" binaries/
              echo "Copied: $file"
            done
            ;;
        esac
        
        # 验证是否复制成功
        if [ ! -d "binaries" ] || [ $(ls -A binaries | wc -l) -eq 0 ]; then
          echo "Error: No files copied to binaries directory"
          exit 1
        fi
        
        echo "Files in binaries directory:"
        ls -la binaries/
    
    - name: 复制二进制文件到GUI目录
      shell: bash
      run: |
        mkdir -p GUI/binaries
        cp -r binaries/* GUI/binaries/
        echo "Files copied to GUI/binaries directory"
        
        # 进入GUI目录并重命名二进制文件，以便 build.py 能够找到
        cd GUI
        case "${{ matrix.goos }}" in
          windows)
            # 复制并重命名 Windows DLL 文件到当前目录
            for file in binaries/TTHighSpeedDownloader_*.dll; do
              if [ -f "$file" ]; then
                cp "$file" "TTHighSpeedDownloader.dll"
                echo "Copied and renamed: $file -> TTHighSpeedDownloader.dll"
              fi
            done
            ;;
          linux)
            # 复制并重命名 Linux SO 文件到当前目录
            for file in binaries/TTHighSpeedDownloader_*.so; do
              if [ -f "$file" ]; then
                cp "$file" "TTHighSpeedDownloader.so"
                echo "Copied and renamed: $file -> TTHighSpeedDownloader.so"
              fi
            done
            ;;
          darwin)
            # 复制并重命名 macOS DYLIB 文件到当前目录
            for file in binaries/TTHighSpeedDownloader_*.dylib; do
              if [ -f "$file" ]; then
                cp "$file" "TTHighSpeedDownloader.dylib"
                echo "Copied and renamed: $file -> TTHighSpeedDownloader.dylib"
              fi
            done
            ;;
        esac
        
        # 验证重命名结果 - 检查当前目录是否有重命名后的文件
        echo "Checking for renamed files in current directory:"
        ls -la TTHighSpeedDownloader.* 2>/dev/null || echo "No renamed files found in current directory"
        
        # 检查是否至少有一个重命名后的文件存在
        if [ ! -f "TTHighSpeedDownloader.dll" ] && [ ! -f "TTHighSpeedDownloader.so" ] && [ ! -f "TTHighSpeedDownloader.dylib" ]; then
          echo "Error: Failed to rename binary files for build.py"
          exit 1
        fi
    
    - name: 编译 GUI 应用 ( Windows )
      if: matrix.goos == 'windows'
      shell: powershell
      run: |
        cd GUI
        & ./.venv/Scripts/activate.ps1
        & python build.py --platform ${{ matrix.goos }}

    - name: 编译 GUI 应用 ( Linux )
      if: matrix.goos == 'linux'
      shell: bash
      run: |
        cd GUI
        source ./.venv/bin/activate
        python build.py --platform ${{ matrix.goos }}

    - name: 编译 GUI 应用 ( MacOS )
      if: matrix.goos == 'darwin'
      shell: bash 
      run: |
        cd GUI
        source ./.venv/bin/activate
        python build.py --platform ${{ matrix.goos }}

    - name: 上传GUI产物
      uses: actions/upload-artifact@v4
      with:
        name: gui-${{ matrix.goos }}-${{ matrix.arch }}
        path: |
          GUI/dist/**
          GUI/dist/*
        if-no-files-found: error

  package-final:
    name: 打包最终发布版本
    needs: [build-go, build-gui]
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码仓库
      uses: actions/checkout@v4
      
    - name: 下载所有产物
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        
    - name: 创建发布包结构
      run: |
        mkdir -p release/packages
        # 组织各平台的完整包
        for platform in windows linux macos; do
          mkdir -p "release/TTHighSpeedDownloader-$platform"
        done
        
    - name: 解析版本号和构建号
      id: parse_version
      shell: python
      run: |
        import re, os
        from datetime import datetime
        from pathlib import Path
        
        # 默认版本
        version = ""
        
        # 如果提供了输入版本，则使用它
        input_version = "${{ github.event.inputs.build_version }}"
        if input_version and input_version.strip():
            version = input_version.strip()
        
        with open("./VersionHistory.txt", "r", encoding="utf-8") as f:
            text = f.read()
          
        for line in text.split('\n'):
            if line.endswith(' V:'):
                version = line.split(' V:')[0]
        
        # 生成构建号 (YYYYMMDD.HHMMSS)
        build_number = datetime.now().strftime("%Y%m%d.%H%M%S")
        
        # 设置 GitHub Actions 输出
        import os
        with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
            print(f'version={version}', file=fh)
            print(f'build_number={build_number}', file=fh)
        
        print(f"Version: {version}, Build: {build_number}")
        
    - name: 打包各平台完整发行版
      run: |
        VERSION=${{ steps.parse_version.outputs.version }}
        BUILD_NUMBER=${{ steps.parse_version.outputs.build_number }}
        FULL_VERSION="${VERSION}+${BUILD_NUMBER}"
        
        # Windows 版本
        mkdir -p "release/TTHighSpeedDownloader-windows-$FULL_VERSION"
        cp -r artifacts/gui-windows-amd64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cp -r artifacts/gui-windows-arm64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-windows-latest-amd64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-windows-latest-arm64/* "release/TTHighSpeedDownloader-windows-$FULL_VERSION/" 2>/dev/null || true
        cd release && zip -r "packages/TTHighSpeedDownloader-windows-$FULL_VERSION.zip" "TTHighSpeedDownloader-windows-$FULL_VERSION"
        
        # Linux 版本
        mkdir -p "release/TTHighSpeedDownloader-linux-$FULL_VERSION"
        cp -r artifacts/gui-linux-amd64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        cp -r artifacts/gui-linux-arm64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-ubuntu-latest-amd64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-ubuntu-latest-arm64/* "release/TTHighSpeedDownloader-linux-$FULL_VERSION/" 2>/dev/null || true
        tar -czf "release/packages/TTHighSpeedDownloader-linux-$FULL_VERSION.tar.gz" -C release "TTHighSpeedDownloader-linux-$FULL_VERSION"
        
        # macOS 版本
        mkdir -p "release/TTHighSpeedDownloader-macos-$FULL_VERSION"
        cp -r artifacts/gui-darwin-amd64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        cp -r artifacts/gui-darwin-arm64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-macos-latest-amd64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        cp artifacts/go-binary-macos-latest-arm64/* "release/TTHighSpeedDownloader-macos-$FULL_VERSION/" 2>/dev/null || true
        tar -czf "release/packages/TTHighSpeedDownloader-macos-$FULL_VERSION.tar.gz" -C release "TTHighSpeedDownloader-macos-$FULL_VERSION"
        
    - name: 上传最终发布包
      uses: actions/upload-artifact@v4
      with:
        name: final-release-packages
        path: release/packages/*
        if-no-files-found: error
